<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 456">
  <!-- Replaces the old generic map-pin foreground (a plain droplet + dot,
       unrelated to weather or routing) with a sun-behind-cloud over a
       winding road: the two things this app actually combines. Kept to
       flat shapes with no fine detail since MAUI crops/masks this
       foreground differently per platform (circle on Android adaptive
       icons, squircle on iOS, etc.) and fine strokes don't survive that. -->

  <!-- Sun -->
  <circle cx="304" cy="146" r="54" fill="#FFC94A" />

  <!-- Cloud (three overlapping circles + a base ellipse, classic flat-cloud
       silhouette) -->
  <circle cx="168" cy="182" r="50" fill="#FFFFFF" />
  <circle cx="232" cy="160" r="60" fill="#FFFFFF" />
  <circle cx="288" cy="188" r="42" fill="#FFFFFF" />
  <ellipse cx="222" cy="208" rx="118" ry="48" fill="#FFFFFF" />

  <!-- Road: a gray winding route with a dashed white centerline, standing
       in for "route" the way the cloud stands in for "weather" -->
  <path d="M 46 372 C 120 330, 150 292, 228 292 C 306 292, 336 330, 410 372"
        fill="none" stroke="#33414D" stroke-width="46" stroke-linecap="round" />
  <path d="M 46 372 C 120 330, 150 292, 228 292 C 306 292, 336 330, 410 372"
        fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="20 22" />
</svg>
